<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- ============================================================
         PRIMARY META
    ============================================================ -->
    <title>The PGD Blog — KIMC Postgraduate Mass Communication 2025</title>
    <meta
      name="description"
      content="Reporting, essays, and commentary from the KIMC Postgraduate Mass Communication Class of 2025. Read The Trend magazine and explore stories that shape Kenya's media landscape."
    />
    <meta name="author" content="KIMC Postgraduate Class of 2025" />
    <meta name="theme-color" content="#0f0f0f" />
    <meta name="color-scheme" content="light dark" />

    <!-- ============================================================
         FAVICON & ICONS
         Files in /public:
           - favicon.ico            (legacy browsers)
           - favicon.svg            (modern browsers — preferred)
           - favicon-96x96.png      (fallback)
           - apple-touch-icon.png   (iOS home screen, 180x180)
           - web-app-manifest-192x192.png (Android)
           - web-app-manifest-512x512.png (Android / PWA)
    ============================================================ -->

    <!-- Modern browsers prefer SVG -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=2" />

    <!-- Legacy fallback -->
    <link rel="icon" type="image/x-icon" href="/favicon.ico?v=2" />
    <link rel="shortcut icon" href="/favicon.ico?v=2" />

    <!-- PNG fallback for browsers that don't render SVG favicons -->
    <link
      rel="icon"
      type="image/png"
      sizes="96x96"
      href="/favicon-96x96.png?v=2"
    />

    <!-- iOS home screen icon -->
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="/apple-touch-icon.png?v=2"
    />

    <!-- Web App Manifest for Android/PWA -->
    <link rel="manifest" href="/site.webmanifest" />

    <!-- ============================================================
         OPEN GRAPH (Facebook, LinkedIn, WhatsApp)
    ============================================================ -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="The PGD Blog" />
    <meta
      property="og:title"
      content="The PGD Blog — KIMC Postgraduate Mass Communication 2025"
    />
    <meta
      property="og:description"
      content="Reporting, essays, and commentary from KIMC's Postgraduate Mass Communication Class of 2025. Read The Trend magazine and explore stories from Kenya's next generation of media leaders."
    />
    <meta property="og:image" content="https://pgdblog.netlify.app/pgd.jpg" />
    <meta property="og:image:alt" content="KIMC Postgraduate Class of 2025" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:url" content="https://pgdblog.netlify.app/" />
    <meta property="og:locale" content="en_KE" />

    <!-- ============================================================
         TWITTER CARD
    ============================================================ -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:title"
      content="The PGD Blog — KIMC Postgraduate Mass Communication 2025"
    />
    <meta
      name="twitter:description"
      content="Reporting, essays, and commentary from KIMC's Postgraduate Mass Communication Class of 2025."
    />
    <meta name="twitter:image" content="https://pgdblog.netlify.app/pgd.jpg" />
    <meta name="twitter:image:alt" content="KIMC Postgraduate Class of 2025" />
    <meta name="twitter:site" content="@pgdblog" />
    <meta name="twitter:creator" content="@pgdblog" />

    <!-- ============================================================
         FONTS
    ============================================================ -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Lato:wght@300;400;700;900&display=swap"
      rel="stylesheet"
    />

    <!-- ============================================================
         ACCESSIBILITY & STRUCTURE
    ============================================================ -->
    <link rel="canonical" href="https://pgdblog.netlify.app/" />
    <meta name="robots" content="index, follow" />
    <meta name="format-detection" content="telephone=no" />

    <style>
      /* Prevent layout shift before React mounts */
      html,
      body {
        margin: 0;
        padding: 0;
        background: #ffffff;
      }
      /* Dark mode aware */
      @media (prefers-color-scheme: dark) {
        html,
        body {
          background: #0a0a0a;
        }
      }
      /* Hide the skip link until focused */
      .skip-link {
        position: absolute;
        left: -9999px;
        top: 0;
        padding: 8px 16px;
        background: #0066cc;
        color: #fff;
        z-index: 9999;
      }
      .skip-link:focus {
        left: 8px;
      }
      /* Noscript fallback */
      .noscript-message {
        padding: 2rem;
        text-align: center;
        font-family: system-ui, sans-serif;
      }
    </style>
  </head>
  <body>
    <!-- Skip link for keyboard users -->
    <a href="#root" class="skip-link">Skip to content</a>

    <noscript>
      <div class="noscript-message">
        <p>
          The PGD Blog requires JavaScript to run. Please enable JavaScript in
          your browser settings to continue.
        </p>
      </div>
    </noscript>

    <div id="root"></div>
    <script type="module" src="/src/index.jsx"></script>
  </body>
</html>
